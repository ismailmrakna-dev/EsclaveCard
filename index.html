<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esclave - ECards</title>
    <link rel="stylesheet" href="./css/output.css">
</head>
<body class="m-0 min-h-screen bg-[url('../assets/images/bg-accueil.png')] bg-cover bg-center bg-no-repeat text-white">
    <header class="flex flex-wrap p-4 gap-8">
        <div class="px-4 flex gap-2">
            <img id="logo" class="w-25 h-25" src="./assets/images/logo-web.png" alt="">
            <h1 class="font-bold text-3xl text-[#EF4444] my-auto p-2"><span class="text-4xl text-[#A78BFA]">E-</span>Cards </h1>
        </div>
        <div id="header-profile">
            <img src="" alt="">
            <span id="name-profile"></span>
        </div>
        <nav id="navigateur" class="hidden flex gap-8">
            <a href="">Accueil</a>
            <a href="">Jouer</a>
            <a href="">Profile</a>
            <a href="">Historique</a>
            <a href="">Classement</a>
        </nav>
    </header>
    <!--   ACCUEIL  -->
    <section id="acceuil-game" class="mb-6">
        <div id="" class="p-4 mt-4 flex flex-col">
            <h1 class="px-4 text-[#D4A64A] text-4xl font-extrabold">EMPEREUR</h1>
            <h1 class="px-6 text-[#60A5FA] text-4xl font-extrabold">. CITOYEN</h1>
            <h1 class="px-4 text-[#A78BFA] text-4xl font-extrabold">ESCLAVE</h1>
            <p class="p-2 pt-4 text-md">Un jeu simple, une société complexe</p>
            <p class="p-2 text-md">Choisis votre profile, défie l'ordinateur, grimpe dans le classement du club</p>
            <div class="p-2 mt-6">
                <button type="button" class="m-2 p-4 w-full text-black bg-[#D4A64A] font-bold rounded-full hover:bg-[#D4A64A]/80 hover:scale-102">⏵Commencer à jouer</button>
                <button type="button" class="m-2 p-4 w-full p-4 border font-bold rounded-full hover:bg-gray-200/40 hover:scale-102"> ◈ Voir les regles</button>
            </div>
        </div>
        <div id="" class="mx-auto p-6 text-center text-xl w-60 max-w-60 text-gray-200 border rounded-xl">
            <p> ⚔ 12 rounds</p>
            <p> ★ 3 camps</p>
            <p>🏆 1 seul vainqueur</p>
        </div>
    </section>
    <footer class="shrink-0 bottom-0 left-0 right-0 z-50">
        <nav id="navigateur-buttom" class="flex bg-[#0B1220] gap-2 w-full shadow-md text-lg border-t border-white/20 p-2">
            <a href="" class="p-2 px-2 flex flex-col hover:bg-[#17243A] hover:scale-103"><span class="text-center">🏠︎</span> Accueil</a>
            <a href="" class="p-2 px-4 flex flex-col hover:bg-[#17243A] hover:scale-103"><span class="text-center">▷</span>Jouer</a>
            <a href="" class="p-2 px-4 flex flex-col hover:bg-[#17243A] hover:scale-103"><span class="text-center">♙</span>Profile</a>
            <a href="" class="p-2 px-2 flex flex-col hover:bg-[#17243A] hover:scale-103"><span class="text-center">◷</span>Historique</a>
        </nav>

    </footer>   
</body>
</html>
