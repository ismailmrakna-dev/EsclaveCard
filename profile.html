<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esclave - ECards</title>
    <link rel="stylesheet" href="./css/output.css">
</head>

<body class="m-0 min-h-screen bg-[url('../assets/images/bg-accueil.png')] bg-cover bg-center bg-no-repeat text-white">
    <header class="flex flex-wrap p-4 gap-8">
        <div class="px-4 flex gap-2">
            <img id="logo" class="w-25 h-25" src="./assets/images/logo-web.png" alt="">
            <h1 class="font-bold text-3xl text-[#EF4444] my-auto p-2"><span
                    class="text-4xl text-[#A78BFA]">E-</span>Cards </h1>
        </div>
        <div id="header-profile">
            <img src="" alt="">
            <span id="name-profile"></span>
        </div>
        <nav id="navigateur" class="hidden flex gap-8">
            <a href="">Accueil</a>
            <a href="">Jouer</a>
            <a href="">Profile</a>
            <a href="">Historique</a>
            <a href="">Classement</a>
        </nav>
    </header>
    <main>
        <!--Gestion des Profiles creer, selection, modifier, show detail, suprimer -->
        <div id="profiles" class="m-4 bg-[#050811] min-h-screen rounded-xl">
            <!--Profile container-->
            <div class="flex items-center gap-15 p-5">
                <h1 class="text-2xl font-bold">Mes Profiles</h1>
                <button type="button" class=" w-1/3 p-2 bg-[#416A9B] text-md text-black bg-[#D4A64A] font-bold rounded-full hover:bg-[#D4A64A]/80 hover:scale-102">Ajouter un Profil</button>
            </div>
            <section id="profiles-container">

            </section>
            <!-- Creation profile-->
            <section id="create-profile" class="hidden">
                <form>
                    <label>Entre Votre Pseudo</label>
                    <input type="text">
                    <label>Select your Avatar:</label>
                    <select name="avatars" id="avatars">
                        
                    </select>
                </form>
            </section>
            <!-- show detail profile -->
            <section id="detail-profile" class="hidden">

            </section>
        </div>
    </main>
    <footer class="shrink-0 bottom-0 left-0 right-0 z-50">
        <nav id="navigateur-buttom"
            class="flex bg-[#0B1220] gap-2 w-full shadow-md text-lg border-t border-white/20 p-2">
            <a href="" class="p-2 px-2 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">🏠︎</span> Accueil</a>
            <a href="" class="p-2 px-4 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">▷</span>Jouer</a>
            <a href="" class="p-2 px-4 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">♙</span>Profile</a>
            <a href="" class="p-2 px-2 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">◷</span>Historique</a>
        </nav>

    </footer>
</body>

</html>
