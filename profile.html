<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esclave - ECards</title>
    <link rel="stylesheet" href="./css/output.css">
</head>

<body class="m-0 min-h-screen bg-[url('../assets/images/bg-accueil.png')] bg-cover bg-center bg-no-repeat text-white">
    <header class="flex flex-wrap items-center p-2 gap-4">
        <div class=" flex items-center gap-2 p-2 mr-6">
            <img id="logo" class="w-20 h-20" src="./assets/images/logo-web.png" alt="">
            <h1 class="font-bold text-xl text-[#EF4444] my-auto p-2"><span
                    class="text-2xl text-[#A78BFA]">E-</span>Cards </h1>
        </div>
        <nav id="navigateur" class="hidden flex gap-8">
            <a href="">Accueil</a>
            <a href="">Jouer</a>
            <a href="">Profile</a>
            <a href="">Historique</a>
            <a href="">Classement</a>
        </nav>
        <div id="header-profile" class="flex items-center gap-2">
            
        </div>
        <p id="header-menu" class="text-lg font-semibold">☰</p>
    </header>
    <main>
        <!--Gestion des Profiles creer, selection, modifier, show detail, suprimer -->
        <div id="profiles" class="m-4 bg-[#050811] min-h-screen rounded-xl">
            <!--Profile container-->
            <div class="relative flex items-center gap-15 p-5">
                <h1 class="text-2xl font-bold">Mes Profiles</h1>
                <button id="ajouterPro-btn" type="button" class=" absolute top-2 right-2 p-2 bg-[#416A9B] m-2 text-md text-black bg-[#D4A64A] font-bold rounded-full hover:bg-[#D4A64A]/80 hover:scale-102">Ajouter un Profil</button>
            </div>
            <section id="profiles-container">

            </section>
            <!-- Creation profile-->
            <section id="create-profile" class="hidden bg-[#17243A] p-4 rounded-xl">
                <div class="relative flex gap-12">
                    <h1 class="text-xl pb-4 font-bold">Creer un profil:</h1>
                    <button type="button" class="hide-create absolute top-2 right-2  py-1 px-2 bg-[#416A9B] text-md text-black bg-[#D4A64A] font-bold rounded-full hover:bg-[#D4A64A]/80 hover:scale-102">X</button>
                </div>
                

                <form>
                    <div class="grid grid-cols-2 w-full">
                        <div class="p-2 mt-2">
                            <label class="font-semibold p-2 mb-4">Pseudo:</label>
                            <input class="nick-name px-4 w-6/7 mt-2 bg-white text-black rounded-xl" type="text">
                        </div>
                        <div id="avatars" class="flex flex-wrap gap-3 p-2 mt-2"> 
                            <div class="character">
                                <img class="rounded-full w-10 h-10 hover:scale-102" src="./assets/avatars/avatar1.jpg" alt="">
                                <p class="hidden">hamouro</p>
                            </div>
                            <div class="character">
                                <img class="rounded-full w-10 h-10 hover:scale-102" src="./assets/avatars/saitama-avatar.png" alt="">
                                <p class="hidden">saitama 1</p>
                            </div>
                            <div class="character">
                                <img class="rounded-full w-10 h-10 hover:scale-102" src="./assets/avatars/saitama2-avatar.png" alt="">
                                <p class="hidden">saitama 2</p>
                            </div>
                            <div class="character">
                                <img class="rounded-full w-10 h-10 hover:scale-102" src="./assets/avatars/kaiji-avatar.webp" alt="">
                                <p class="hidden">kaiji</p>
                            </div>
                        </div>
                        <p id="message" class="text-md"></p>
                    </div>
                    <div class="flex gap-4 py-4 mt-4">
                        <button type="submit" class="p-2 w-full bg-[#416A9B] text-md text-black bg-[#D4A64A] font-bold rounded-full hover:bg-[#D4A64A]/80 hover:scale-102">Creer profile</button>
                        <button type="reset" class="p-2 w-full bg-[#416A9B] text-md text-black bg-[#D4A64A] font-bold rounded-full hover:bg-[#D4A64A]/80 hover:scale-102">Effacer</button>
                    </div>
                </form>
            </section>
            <!-- show detail profile -->
            <section id="detail-profile">
            </section>
        </div>
    </main>
    <footer class="fixed shrink-0 bottom-0 left-0 right-0">
        <nav id="navigateur-buttom"
            class="bg-[#0B1220] grid grid-cols-4 gap-2 w-full shadow-md text-lg border-t border-white/20">
            <a href="" class="p-2 px-2 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">🏠︎</span> Accueil</a>
            <a href="" class="p-2 px-4 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">▷</span>Jouer</a>
            <a href="" class="p-2 px-4 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">♙</span>Profile</a>
            <a href="" class="p-2 px-2 flex flex-col hover:bg-[#17243A] hover:scale-103"><span
                    class="text-center">◷</span>Historique</a>
        </nav>

    </footer>
    <script src="./src/data.js"></script>
    <script src="./src/profile.js"></script>
    
</body>

</html>
